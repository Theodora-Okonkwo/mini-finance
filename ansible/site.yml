---
# ═══════════════════════════════════════════════════════════════
# Play 1 — Install & Configure Nginx
# ═══════════════════════════════════════════════════════════════
- name: Install and configure Nginx
  hosts: web
  become: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx and Git
      apt:
        name:
          - nginx
          - git
        state: present

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

# ═══════════════════════════════════════════════════════════════
# Play 2 — Clone & Deploy Mini Finance Site
# ═══════════════════════════════════════════════════════════════
- name: Clone and deploy Mini Finance site
  hosts: web
  become: true

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

  tasks:
    - name: Remove default Nginx page
      file:
        path: /var/www/html/index.nginx-debian.html
        state: absent

    - name: Clone the Mini Finance repository
      git:
        repo: https://github.com/pravinmishraaws/mini_finance
        dest: /tmp/mini-finance-project
        force: yes
        version: main

    - name: Copy site content to /var/www/html/
      copy:
        src: /tmp/mini-finance-project/
        dest: /var/www/html/
        remote_src: yes
        owner: www-data
        group: www-data
        mode: '0755'
      notify: Reload Nginx

    - name: Set ownership of web root recursively
      file:
        path: /var/www/html
        owner: www-data
        group: www-data
        recurse: yes
        state: directory

# ═══════════════════════════════════════════════════════════════
# Play 3 — Verify Deployment
# ═══════════════════════════════════════════════════════════════
- name: Verify deployment via HTTP check
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_ip: "{{ hostvars[groups['web'][0]]['ansible_host'] | default(groups['web'][0]) }}"

  tasks:
    - name: Check HTTP response from the Mini Finance site
      uri:
        url: "http://{{ target_ip }}"
        method: GET
        status_code: 200
        timeout: 30
      register: http_result

    - name: Assert site returns HTTP 200
      assert:
        that:
          - http_result.status == 200
        success_msg: "Site is UP — HTTP {{ http_result.status }} from http://{{ target_ip }}"
        fail_msg:    "Site check FAILED — HTTP {{ http_result.status }} from http://{{ target_ip }}"